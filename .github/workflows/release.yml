name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build Linux executable and extension WASM
        run: |
          cargo build --locked --release --manifest-path zrd/Cargo.toml
          cargo build --locked --release --manifest-path extension/Cargo.toml --target wasm32-wasip2
      - name: Package release
        run: |
          mkdir -p dist/package/extension
          cp zrd/target/release/zrd dist/package/zrd
          cp extension/extension.toml extension/Cargo.toml extension/Cargo.lock dist/package/extension/
          cp -R extension/src dist/package/extension/src
          cp extension/target/wasm32-wasip2/release/zed_remote_development.wasm dist/package/extension/zed_remote_development.wasm
          tar -czf dist/zed-remote-development-linux-x86_64.tar.gz -C dist/package .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/zed-remote-development-linux-x86_64.tar.gz
            scripts/install-linux.sh
            scripts/uninstall-linux.sh
