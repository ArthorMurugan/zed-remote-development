[package]
name = "zrd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native agent for the Zed Remote Development extension: connects machines, discovers development environments, and hands off to Zed."
repository = "https://github.com/ArthorMurugan/zed-remote-development"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
dirs = "5"

[dev-dependencies]
tempfile = "3"
